<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>混合流</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#111;color:#eee;font:16px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif;padding:24px 20px 40px;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:420px;margin:0 auto}
  .cover{width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#222}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  h1{font-size:22px;margin:18px 0 4px;line-height:1.3}
  .singer{color:#999;margin-bottom:18px;min-height:24px}
  .bar{display:flex;align-items:center;gap:10px;font-size:12px;color:#888}
  input[type=range]{flex:1;accent-color:#1db954}
  .ctrl{display:flex;justify-content:center;align-items:center;gap:32px;margin:16px 0 24px}
  button{background:none;border:0;color:#eee;font-size:34px;cursor:pointer;padding:6px}
  #play{font-size:52px}
  #start{display:block;width:100%;padding:16px;border-radius:12px;background:#1db954;color:#000;font-size:17px;font-weight:600;margin-top:20px}
  #start[hidden]{display:none}
  .up{border-top:1px solid #2a2a2a;padding-top:14px}
  .up h2{font-size:13px;color:#888;font-weight:400;margin:0 0 10px}
  .up ul{margin:0;padding:0}
  .up li{list-style:none;display:flex;align-items:center;gap:8px;padding:7px 0;font-size:14px}
  .up li b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .up li em{font-style:normal;color:#777;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
  .tag{font-size:11px;padding:1px 6px;border-radius:4px;flex:0 0 auto}
  .fav{background:#1db95433;color:#1db954}
  .radar{background:#4a90d933;color:#6aa9e9}
</style>
</head>
<body>
<div class="wrap">
  <div class="cover"><img id="cover" alt=""></div>
  <h1 id="name">混合流</h1>
  <div class="singer" id="singer"></div>
  <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="ctrl">
    <button id="prev">⏮</button>
    <button id="play">▶</button>
    <button id="next">⏭</button>
  </div>
  <button id="start">开始播放</button>
  <div class="up">
    <h2>接下来 5 首</h2>
    <ul id="upcoming"></ul>
  </div>
</div>
<audio id="au" preload="auto"></audio>
<script>
const au = document.getElementById('au');
const $ = id => document.getElementById(id);
let current = null, upcoming = [], stack = [], loading = false;

function fmt(s){ if(!isFinite(s)) return '0:00'; const m=Math.floor(s/60), x=Math.floor(s%60); return m+':'+String(x).padStart(2,'0'); }

function render(){
  if(!current) return;
  $('name').textContent = current.name;
  $('singer').textContent = current.singer;
  $('cover').src = current.cover;
  document.title = current.name;
  $('upcoming').innerHTML = upcoming.map(t =>
    '<li><span class="tag ' + (t.kind==='fav'?'fav':'radar') + '">' + (t.kind==='fav'?'藏':'新') + '</span>' +
    '<b>' + t.name + '</b><em>' + t.singer + '</em></li>').join('');
  if(navigator.mediaSession){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: current.name, artist: current.singer,
      artwork: current.cover ? [{src: current.cover, sizes: '300x300'}] : []
    });
  }
}

async function load(){
  if(loading) return; loading = true;
  try {
    const d = await (await fetch('/api/next')).json();
    if(!d.current){ loading=false; setTimeout(load, 1500); return; }
    if(current) stack.push(current);
    current = d.current; upcoming = d.upcoming || [];
    render();
    au.src = current.url;
    await au.play().catch(()=>{});
  } finally { loading = false; }
}

$('start').onclick = () => { $('start').hidden = true; load(); };
$('next').onclick = () => load();
$('prev').onclick = () => {
  if(!stack.length) return;
  const old = current;
  current = stack.pop();
  upcoming = [old, ...upcoming].slice(0,5);
  render();
  au.src = current.url;
  au.play().catch(()=>{});
};
$('play').onclick = () => au.paused ? au.play().catch(()=>{}) : au.pause();
au.onended = () => load();
au.onplay = () => $('play').textContent = '⏸';
au.onpause = () => $('play').textContent = '▶';
au.ontimeupdate = () => {
  if(!au.duration) return;
  $('seek').value = au.currentTime / au.duration * 1000;
  $('cur').textContent = fmt(au.currentTime);
};
au.onloadedmetadata = () => $('dur').textContent = fmt(au.duration);
$('seek').oninput = () => { if(au.duration) au.currentTime = $('seek').value / 1000 * au.duration; };
if(navigator.mediaSession){
  navigator.mediaSession.setActionHandler('nexttrack', () => load());
  navigator.mediaSession.setActionHandler('previoustrack', () => $('prev').click());
  navigator.mediaSession.setActionHandler('play', () => au.play());
  navigator.mediaSession.setActionHandler('pause', () => au.pause());
}
</script>
</body>
</html>
